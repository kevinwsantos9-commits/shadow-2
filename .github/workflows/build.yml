name: Build Shadow Servants

on:
  push:
    branches:
      - "**"

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build NeoForge Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Verificar Gradle
        run: ./gradlew --version

      - name: Compilar mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Verificar JAR
        run: |
          echo "JARs gerados:"
          ls -lh build/libs/

      - name: Enviar JAR como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowServants-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
